[project]
name = "typeout"
version = "0.5.1"
description = "Transcribe audio/video to text using ASR."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "miku" }]
keywords = ["asr", "transcription", "whisper", "speech-to-text"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/miku/typeout"
Repository = "https://github.com/miku/typeout"

[project.scripts]
typeout = "typeout_tool:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typeout_tool"]
artifacts = ["src/typeout_tool/typeout"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/typeout_tool",
    "/README.md",
    "/LICENSE",
]
